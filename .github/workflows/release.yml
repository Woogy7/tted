name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --locked --release
          strip: true
      - name: Package binary and checksum
        run: |
          tar -czf tted-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release tted
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum tted-${{ matrix.target }}.tar.gz > tted-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 tted-${{ matrix.target }}.tar.gz > tted-${{ matrix.target }}.tar.gz.sha256
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tted-${{ matrix.target }}.tar.gz
            tted-${{ matrix.target }}.tar.gz.sha256
